<svg viewBox="0 0 1000 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Telemetry: repositories, followers, stars and language distribution">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#11142b"/>
      <stop offset="100%" stop-color="#0c1022"/>
    </linearGradient>
    <linearGradient id="bar1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1a3e8a"/>
      <stop offset="100%" stop-color="#3f6fd1"/>
    </linearGradient>
  </defs>
  <style>
    .mono { font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .num { font-size: 42px; font-weight: 700; fill: #9db7ff; }
    .lbl { font-size: 12px; letter-spacing: 2px; fill: #5b6a9a; text-transform: uppercase; }
    .hdr { font-size: 13px; letter-spacing: 3px; fill: #3f6fd1; }
    .rule { stroke: #1f2747; stroke-width: 1; }
    .bartrack { fill: #171b38; }
    .bar { transform-origin: left; animation: grow 1.1s cubic-bezier(.2,.7,.2,1) forwards; }
    .barlabel { font-size: 12px; fill: #8694c4; }
    @keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
  </style>

  <rect x="0" y="0" width="1000" height="260" fill="url(#bg)"/>
  <rect x="0" y="0" width="1000" height="260" fill="none" stroke="#1f2747" stroke-width="1"/>

  <text x="30" y="34" class="mono hdr">03 — TELEMETRY</text>
  <line x1="30" y1="46" x2="970" y2="46" class="rule"/>

  <g class="mono">
    <text x="30" y="110" class="num">13</text>
    <text x="30" y="132" class="lbl">repositories</text>

    <text x="270" y="110" class="num">0</text>
    <text x="270" y="132" class="lbl">followers</text>

    <text x="510" y="110" class="num">0</text>
    <text x="510" y="132" class="lbl">stars earned</text>

    <text x="750" y="110" class="num">3</text>
    <text x="750" y="132" class="lbl">languages</text>
  </g>

  <line x1="30" y1="160" x2="970" y2="160" class="rule"/>

  <g class="mono" transform="translate(30,185)">
    <text x="0" y="0" class="barlabel">Java</text>
    <rect x="90" y="-11" width="700" height="14" rx="3" class="bartrack"/>
    <rect x="90" y="-11" width="509" height="14" rx="3" fill="url(#bar1)" class="bar"/>
    <text x="800" y="0" class="barlabel">73%</text>
  </g>
  <g class="mono" transform="translate(30,215)">
    <text x="0" y="0" class="barlabel">Kotlin</text>
    <rect x="90" y="-11" width="700" height="14" rx="3" class="bartrack"/>
    <rect x="90" y="-11" width="127" height="14" rx="3" fill="url(#bar1)" class="bar"/>
    <text x="800" y="0" class="barlabel">18%</text>
  </g>
  <g class="mono" transform="translate(30,245)">
    <text x="0" y="0" class="barlabel">Python</text>
    <rect x="90" y="-11" width="700" height="14" rx="3" class="bartrack"/>
    <rect x="90" y="-11" width="64" height="14" rx="3" fill="url(#bar1)" class="bar"/>
    <text x="800" y="0" class="barlabel">9%</text>
  </g>
</svg>
